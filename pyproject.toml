[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfheal"
version = "0.1.0"
description = "A coding agent that writes, runs, and fixes its own Python scripts, powered by Claude."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "selfheal contributors" }]
keywords = ["ai", "agent", "claude", "anthropic", "coding-agent", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/sairam400/selfheal"
Issues = "https://github.com/sairam400/selfheal/issues"

[project.scripts]
selfheal = "selfheal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["selfheal"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
